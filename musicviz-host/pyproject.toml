[project]
name = "musicviz-host"
version = "0.1.0"
description = "Host streamer for the lucky65 music visualizer: WASAPI loopback -> FFT -> raw HID"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "soundcard>=0.4.3",
    "hidapi>=0.14.0",
    "textual>=8.2.8",
    "pystray>=0.19.5",
    "pillow>=12.3.0",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
